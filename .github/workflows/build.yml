name: Build Windows exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Compile
        shell: msys2 {0}
        run: g++ -std=c++17 -O2 archiwum.cpp -o game.exe -lgdi32 -static -mwindows

      - uses: actions/upload-artifact@v4
        with:
          name: archiwum-game
          path: game.exe
